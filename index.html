<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>huangfamilies.com｜黄氏数字家园</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: #2b2b2b;
      background: #f7f4ed;
    }

    /* ===== 顶部导航 ===== */

    header {
      background: #ffffff;
      border-bottom: 1px solid #ddd6c8;
      padding: 22px 8%;
      position: relative;
      z-index: 10;
    }

    .topbar {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 36px;
      font-size: 17px;
    }

    nav a {
      color: #333;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* ===== 首页主画面：家族树 + 文字 ===== */

    .hero {
      position: relative;

      /* 使用已经上传到仓库的原图 */
      background-image: url("huang-family-tree.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;

      /* 一屏式主视觉 */
      min-height: calc(100vh - 73px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 24px;
      overflow: hidden;
    }

    /*
      淡色遮罩：
      不修改原图文件，只在网页显示层增加轻微白色透明层，
      让黑色文字压在树图上仍然容易阅读。
    */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(247, 244, 237, 0.28);
      z-index: 1;
    }

    .hero-inner {
      position: relative;
      z-index: 2;

      width: min(720px, 90%);
      text-align: center;



      padding: 36px 42px;
    }

    .eyebrow {
      letter-spacing: 3px;
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 24px;
      font-weight: 600;
    }

    .mission {
      font-size: 20px;
      line-height: 1.9;
      margin: 0;
    }

    .sub {
      margin-top: 28px;
      color: #666;
      font-size: 15px;
      line-height: 1.7;
    }

    /* ===== 页脚 ===== */

    footer {
      background: #ffffff;
      text-align: center;
      padding: 24px;
      border-top: 1px solid #ddd6c8;
      color: #777;
      font-size: 14px;
    }

    /* ===== 手机 ===== */

    @media (max-width: 700px) {
      header {
        padding: 18px 20px;
      }

      .topbar {
        flex-direction: column;
        gap: 16px;
      }

      nav {
        gap: 18px;
        font-size: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero {
        min-height: 760px;
        padding: 40px 18px;
        background-size: cover;
        background-position: center center;
      }

      .hero-inner {
        width: 100%;
        padding: 28px 20px;

      }

      h1 {
        font-size: 38px;
      }

      .mission {
        font-size: 17px;
        line-height: 1.8;
      }

      .sub {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="topbar">

    <div class="brand">
      huangfamilies.com
    </div>

    <nav>
      <a href="huangshi.html">黄氏源流</a>
      <a href="misterwutong.html">忢同先生</a>
      <a href="xiuqizhiping.html">修齐治平</a>
    </nav>

  </div>
</header>


<main class="hero">

  <div class="hero-inner">

    <div class="eyebrow">
      LIVING FAMILY ARCHIVE
    </div>

    <h1>
      黄氏数字家园
    </h1>

    <p class="mission">
      记录正在发生的历史。<br>
      寻找并完善已经发生的历史。<br>
      提炼并数字化五十多年的人生。<br>
      建立可记录、可查询、可扩充、可迁移、可恢复的数字家园。
    </p>

    <div class="sub">
      从在美第一代开始，留给第二代、第三代，以及后来的人。
    </div>

  </div>

</main>


<footer>
  © 2026 huangfamilies.com
</footer>

</body>
</html>
