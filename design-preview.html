<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>huangfamilies.com｜全站可视化装修台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #ececec;
      color: #222;
    }

    /* ===== 顶部工具栏 ===== */

    .designer-header {
      height: 64px;
      background: #222;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;
      gap: 20px;
    }

    .designer-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .designer-title span {
      color: #aaa;
      font-weight: 400;
      margin-left: 8px;
      font-size: 13px;
    }

    .page-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-switcher label {
      color: #bbb;
      font-size: 13px;
    }

    select,
    input,
    textarea,
    button {
      font: inherit;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 8px 9px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 9px 14px;
      cursor: pointer;
    }

    /* ===== 主工作区 ===== */

    .workspace {
      height: calc(100vh - 64px);

      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    /* ===== 左侧真实网页预览 ===== */

    .preview-area {
      padding: 18px;
      overflow: hidden;
    }

    .preview-frame-wrap {
      width: 100%;
      height: 100%;

      background: white;
      border-radius: 8px;
      overflow: hidden;

      box-shadow: 0 3px 18px rgba(0,0,0,.15);
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* ===== 右侧装修控制台 ===== */

    .control-panel {
      background: #fafafa;
      border-left: 1px solid #ccc;
      padding: 18px;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .control-group {
      margin-bottom: 17px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 8px;
      align-items: center;
    }

    #fontColor {
      height: 38px;
      padding: 2px;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.5;
    }

    .status {
      padding: 10px;
      margin: 15px 0;

      background: #f0f0f0;
      border-radius: 5px;

      color: #555;
      font-size: 12px;
      line-height: 1.6;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #ddd;
      color: #222;
    }

    .output-box {
      margin-top: 18px;
    }

    #cssOutput {
      min-height: 130px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    /* ===== 小屏 ===== */

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }

      .preview-area {
        height: 70vh;
      }

      .control-panel {
        border-left: 0;
        border-top: 1px solid #ccc;
      }

      .designer-header {
        height: auto;
        padding: 12px;
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 装修台顶部 ===== -->

  <header class="designer-header">

    <div class="designer-title">
      huangfamilies.com
      <span>全站可视化装修台 v0.2</span>
    </div>

    <div class="page-switcher">

      <label for="pageSelect">页面</label>

      <select id="pageSelect">
        <option value="index.html">首页｜黄氏数字家园</option>

  <main class="workspace">

    <!-- ===== 右：控制台 ===== -->

    <aside class="control-panel">

      <h2 class="panel-title">装修控制台</h2>
<div class="status" id="saveStatusBox">
  ○ 尚无待发布修改
</div>
      <p class="panel-subtitle">
        选择页面和文字对象，调整参数后，左侧实时预览。
        v0.2 自动识别文字；只做预览，不直接修改正式网页。
      </p>


      <!-- 文字对象 -->

      <div class="control-group">

        <label for="elementSelect">
          文字对象
        </label>

        <select id="elementSelect">
          <option value="">请选择文字对象</option>

      <!-- X / Y -->

        <div class="control-group">

          </label>

          <input

            type="number"
            min="-500"

        </div>

      </div>

<!-- Image Block -->

<div class="two-column">

  <div class="control-group">

    <label for="imageWidth">

    </label>

    <input
      id="imageWidth"

    </label>

  </div>

</div>
      <div class="status" id="statusBox">
        当前：等待选择文字对象。
      </div>


      <div class="button-row">

        <button
          class="secondary"
          id="resetButton">
          恢复当前对象
        </button>

        <button
          class="primary"
          id="generateButton">
          生成 CSS
        </button>

      </div>


      <div class="output-box">

        <div class="control-group">

          <label for="cssOutput">
            最终 CSS / 配置
          </label>

          <textarea
            id="cssOutput"
            readonly
            placeholder="调整完成后点击“生成 CSS”">
          </textarea>

        </div>

      </div>

    </aside>

  </main>


  <script>

    /*
      =====================================================
      huangfamilies.com 全站可视化装修台 v0.2

      原则：
      1. 左侧 iframe 读取真实网页。
      2. 所有修改只发生在浏览器当前预览。
      3. 不写回 GitHub。
      4. 不破坏正式页面。
      =====================================================
    */


    const pageSelect = document.getElementById("pageSelect");
    const previewFrame = document.getElementById("previewFrame");

    const elementSelect = document.getElementById("elementSelect");

    const textContent = document.getElementById("textContent");

    const fontFamily = document.getElementById("fontFamily");
    const fontSize = document.getElementById("fontSize");
    const fontWeight = document.getElementById("fontWeight");

    const fontColor = document.getElementById("fontColor");
    const fontColorText = document.getElementById("fontColorText");

    const lineHeight = document.getElementById("lineHeight");
    const letterSpacing = document.getElementById("letterSpacing");

    const moveX = document.getElementById("moveX");
    const moveY = document.getElementById("moveY");
const imageWidth =
  document.getElementById("imageWidth");

const imageRadius =
  document.getElementById("imageRadius");
    const resetButton = document.getElementById("resetButton");
    const generateButton = document.getElementById("generateButton");

    const cssOutput = document.getElementById("cssOutput");
    const statusBox = document.getElementById("statusBox");

const saveStatusBox =
  document.getElementById("saveStatusBox");
    let selectedElement = null;

    let originalStyle = "";
    let originalHTML = "";
    /*
      =====================================================
      v0.3｜Kevin 装修修改持久化存储
      =====================================================

      Save ≠ Publish

      1. Kevin 的装修修改自动保存到浏览器 localStorage。
      2. 刷新、关闭浏览器后，修改仍然保留。
      3. 保存的修改属于“待发布修改”。
      4. 此阶段仍然不直接修改 GitHub 正式网页。
    */

    const STORAGE_KEY =
      "huangfamilies-design-changes-v0.3";

    let savedChanges = loadSavedChanges();


    function loadSavedChanges() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return {};
        }

        return JSON.parse(saved);

      } catch (error) {

        console.log(
          "读取装修修改失败：",
          error
        );

        return {};

      }

    }


    function writeSavedChanges() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(savedChanges)
        );

      } catch (error) {

        console.log(
          "保存装修修改失败：",
          error
        );

      }

    }
function updateSaveStatus(mode) {

  const count =
    Object.keys(savedChanges).length;

  if (count === 0) {

    saveStatusBox.textContent =
      "○ 尚无待发布修改";

    return;
  }


  if (mode === "restored") {

    saveStatusBox.textContent =
      "✓ 已恢复 ｜ 待发布 " +
      count +
      " 项";

    return;
  }


  saveStatusBox.textContent =
    "✓ 已自动保存 ｜ 待发布 " +
    count +
    " 项";

}
    /*
      页面切换
    */

    pageSelect.addEventListener("change", function () {

      selectedElement = null;

      previewFrame.src = this.value;

      elementSelect.innerHTML =
        '<option value="">请选择文字对象</option>';

      statusBox.textContent =
        "正在加载：" + this.options[this.selectedIndex].text;

    });


    /*
      iframe 加载完成
    */

previewFrame.addEventListener("load", function () {

  /*
    读取 iframe 当前真实页面，
    防止页面选择器与左侧实际页面不同步
  */

  try {

const currentPageId =
  getCurrentPageId();

/*
  当前真实页面不再受四页面白名单限制。

  已登记页面：
  同步顶部页面选择器。

  新的第三级 / 第四级 / 更深页面：
  自动加入选择器，并以真实页面路径作为 Page ID。
*/

let pageOption =
  Array.from(pageSelect.options)
    .find(function (option) {
      return option.value === currentPageId;
    });

if (!pageOption) {

  pageOption =
    document.createElement("option");

  pageOption.value =
    currentPageId;

  pageOption.textContent =
    "当前页面｜" + currentPageId;

  pageSelect.appendChild(pageOption);
}

pageSelect.value =
  currentPageId;

  } catch (error) {

    console.log(
      "无法读取当前预览页面：",
      error
    );

  }

buildElementList();

const restoredCount =
  restoreSavedChangesForCurrentPage();

enableDirectSelection();

if (restoredCount > 0) {

  updateSaveStatus("restored");

  statusBox.textContent =
    "页面已加载。可以继续装修。";

} else {

  updateSaveStatus();

  statusBox.textContent =
    "页面已加载。可以直接点击左侧文字进行装修。";

}


});

/*
  =====================================================
  Content Node v0.1｜真实 Page ID
  =====================================================

  页面身份来自 iframe 当前真实 URL，
  不再来自顶部四页面下拉菜单。

  根目录页面：
  /huangshi.html

  未来深层页面：
  /huangshi/america/new-york.html

  都可以成为独立 Page ID。
*/

function getCurrentPageId() {

  try {

    const currentPath =
      previewFrame.contentWindow.location.pathname;

    const repoMarker =
      "/huangfamilies.com/";

    let pageId =
      currentPath;

    if (pageId.includes(repoMarker)) {

      pageId =
        pageId.split(repoMarker)[1];

    } else {

      pageId =
        pageId.split("/").filter(Boolean).join("/");

    }

    pageId =
      pageId.replace(/^\/+|\/+$/g, "");

    if (!pageId) {
      return "index.html";
    }

    const lastPart =
      pageId.split("/").pop();

    if (!lastPart.includes(".")) {
      pageId += "/index.html";
    }

    return pageId;

  } catch (error) {

    console.log(
      "无法读取真实 Page ID：",
      error
    );

    return pageSelect.value || "index.html";

  }

}
    /*
      建立当前页面可编辑对象列表
    */

function buildElementList() {

  /*
    v0.2：
    不再预先登记文字对象。

    页面加载时只清空菜单。
    Kevin 点击左侧任意可见文字后，
    系统自动识别并加入文字对象菜单。
  */

  elementSelect.innerHTML =
    '<option value="">请直接点击左侧文字</option>';

}


    /*
      选择文字对象
    */

    elementSelect.addEventListener("change", function () {

      const selector = this.value;

      if (!selector) {
        selectedElement = null;
        return;
      }

      const doc =
        previewFrame.contentDocument ||
        previewFrame.contentWindow.document;

      selectedElement = doc.querySelector(selector);

      if (!selectedElement) {

        statusBox.textContent =
          "未找到对象：" + selector;

        return;

      }

      originalStyle =
        selectedElement.getAttribute("style") || "";

      originalHTML =
        selectedElement.innerHTML;

      loadCurrentValues();

      statusBox.textContent =
        "正在装修：" +
        this.options[this.selectedIndex].text;

    });


    /*
      把网页当前参数读取到右侧面板
    */

    function loadCurrentValues() {

      if (!selectedElement) return;

      const win = previewFrame.contentWindow;

      const style =
        win.getComputedStyle(selectedElement);

      textContent.value =
        selectedElement.innerText;

      fontSize.value =
        parseFloat(style.fontSize) || 24;

      fontWeight.value =
        style.fontWeight || 400;

      fontColor.value =
        rgbToHex(style.color);

      fontColorText.value =
        rgbToHex(style.color);

      lineHeight.value =
        parseFloat(style.lineHeight) /
        parseFloat(style.fontSize) || 1.5;

      letterSpacing.value =
        style.letterSpacing === "normal"
          ? 0
          : parseFloat(style.letterSpacing) || 0;

      moveX.value = 0;
      moveY.value = 0;
if (selectedElement.tagName === "IMG") {

  imageWidth.value =
    parseFloat(style.width) /
    selectedElement.parentElement.clientWidth *
    100 || 100;

  imageRadius.value =
    parseFloat(style.borderRadius) || 0;

}
    }


    /*
      所有控制项变化时，立即更新左侧页面
    */

    const liveControls = [
      textContent,
      fontFamily,
      fontSize,
      fontWeight,
      fontColor,
      fontColorText,
      lineHeight,
letterSpacing,
moveX,
moveY,
imageWidth,
imageRadius
];


    liveControls.forEach(function (control) {

      control.addEventListener("input", applyChanges);
      control.addEventListener("change", applyChanges);

    });


function applyChanges() {

  if (!selectedElement) return;

  /*
    文字内容
  */

  selectedElement.innerHTML =
    escapeHTML(textContent.value)
    .replace(/\n/g, "<br>");


  /*
    字体
  */

  selectedElement.style.fontFamily =
    fontFamily.value;


  /*
    字号
  */

  selectedElement.style.fontSize =
    fontSize.value + "px";


  /*
    字重
  */

  selectedElement.style.fontWeight =
    fontWeight.value;


  /*
    颜色同步
  */

  let color = fontColorText.value;

  if (
    document.activeElement === fontColor
  ) {

    color = fontColor.value;
    fontColorText.value = color;

  } else if (
    /^#[0-9A-Fa-f]{6}$/.test(fontColorText.value)
  ) {

    fontColor.value = fontColorText.value;
    color = fontColorText.value;

  }

  selectedElement.style.color = color;


  /*
    行距 / 字距
  */

  selectedElement.style.lineHeight =
    lineHeight.value;

  selectedElement.style.letterSpacing =
    letterSpacing.value + "px";


  /*
    X / Y
  */

  selectedElement.style.transform =
    "translate(" +
    moveX.value +
    "px, " +
    moveY.value +
    "px)";
/*
  Image Block
*/

if (selectedElement.tagName === "IMG") {

  selectedElement.style.width =
    imageWidth.value + "%";

  selectedElement.style.borderRadius =
    imageRadius.value + "px";

}

  /*
    =====================================================
    v0.3｜Auto Save
    =====================================================
  */

const page =
  getCurrentPageId();

  const selector =
    elementSelect.value;

  if (!page || !selector) {
    return;
  }


  /*
    Page + Selector 组成唯一修改 ID
  */

  const changeId =
    page + "::" + selector;


  savedChanges[changeId] = {

    page: page,

    selector: selector,

    label:
      elementSelect.options[
        elementSelect.selectedIndex
      ].text,

    text:
      textContent.value,

    style: {
      fontFamily: fontFamily.value,
      fontSize: fontSize.value,
      fontWeight: fontWeight.value,
      color: color,
      lineHeight: lineHeight.value,
      letterSpacing: letterSpacing.value,
moveX: moveX.value,
moveY: moveY.value,
imageWidth: imageWidth.value,
imageRadius: imageRadius.value
    },

    updatedAt:
      new Date().toISOString()

  };


  /*
    写入浏览器持久存储
  */

  writeSavedChanges();


updateSaveStatus("saved");

}
/*
  =====================================================
  v0.3｜Restore Saved Changes
  =====================================================
*/

function restoreSavedChangesForCurrentPage() {

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;

const page =
  getCurrentPageId();

  let restoredCount = 0;


  Object.values(savedChanges)
    .forEach(function (change) {

      if (change.page !== page) {
        return;
      }


      let element = null;

      try {

        element =
          doc.querySelector(change.selector);

      } catch (error) {

        console.log(
          "无法恢复 selector：",
          change.selector,
          error
        );

        return;

      }


      if (!element) {

        console.log(
          "找不到待恢复对象：",
          change.selector
        );

        return;

      }


      /*
        恢复文字
      */

      element.innerHTML =
        escapeHTML(change.text)
        .replace(/\n/g, "<br>");


      /*
        只恢复 Kevin 可编辑的样式。
        不恢复 cursor / outline 等装修台辅助样式。
      */

      const style =
        change.style || {};

      element.style.fontFamily =
        style.fontFamily || "";

      element.style.fontSize =
        style.fontSize
          ? style.fontSize + "px"
          : "";

      element.style.fontWeight =
        style.fontWeight || "";

      element.style.color =
        style.color || "";

      element.style.lineHeight =
        style.lineHeight || "";

      element.style.letterSpacing =
        style.letterSpacing !== undefined
          ? style.letterSpacing + "px"
          : "";

      element.style.transform =
        "translate(" +
        (style.moveX || 0) +
        "px, " +
        (style.moveY || 0) +
        "px)";
if (element.tagName === "IMG") {

  element.style.width =
    style.imageWidth
      ? style.imageWidth + "%"
      : "";

  element.style.borderRadius =
    style.imageRadius !== undefined
      ? style.imageRadius + "px"
      : "";

}
      restoredCount += 1;

    });


  return restoredCount;

}

    /*
      恢复当前对象
    */

    resetButton.addEventListener("click", function () {

      if (!selectedElement) return;

      selectedElement.setAttribute(
        "style",
        originalStyle
      );

      selectedElement.innerHTML =
        originalHTML;

      loadCurrentValues();

      statusBox.textContent =
        "当前对象已恢复到打开装修前的状态。";

    });


    /*
      生成当前对象最终 CSS
    */

    generateButton.addEventListener("click", function () {

      if (!selectedElement) {

        statusBox.textContent =
          "请先选择文字对象。";

        return;

      }

      const selector =
        elementSelect.value;

      const css =
`${selector} {
  font-family: ${fontFamily.value};
  font-size: ${fontSize.value}px;
  font-weight: ${fontWeight.value};
  color: ${fontColorText.value};
  line-height: ${lineHeight.value};
  letter-spacing: ${letterSpacing.value}px;
  transform: translate(${moveX.value}px, ${moveY.value}px);
}`;

      cssOutput.value = css;

      statusBox.textContent =
        "CSS 已生成。正式页面尚未被修改。";

    });



/*

  =====================================================
  v0.2｜自动识别文字 + 左侧直接点选
  =====================================================

  目标：
  1. 不再依赖 editableElements 手工登记每一个文字对象。
  2. 页面加载后自动寻找可见文字。
  3. Kevin 看到什么文字，就可以直接点击什么文字。
  4. 点击后自动生成该对象的唯一 selector。
  5. 自动加入右侧“文字对象”菜单。
  6. 自动读取当前文字和样式参数。
*/


function enableDirectSelection() {

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;


  /*
    找出页面中所有包含“直接文字”的元素。

    这里不是只认 h1 / p / card，
    而是根据页面真实 DOM 自动判断。
  */

  const allElements =
    doc.body.querySelectorAll("*");


  allElements.forEach(function (element) {

    /*
      跳过不应该作为文字对象的元素
    */

    const blockedTags = [
      "SCRIPT",
      "STYLE",
      "NOSCRIPT",
      "SVG",
      "PATH",
      "BR",
      "HR"
    ];

    if (blockedTags.includes(element.tagName)) {
      return;
    }


    /*
      判断这个元素自己是否直接拥有文字。

      这样可以避免点击一个大 DIV 时，
      一次选中整个页面或整张卡片。
    */

const hasDirectText =
  Array.from(element.childNodes)
    .some(function (node) {

      return (
        node.nodeType === Node.TEXT_NODE &&
        node.textContent.trim() !== ""
      );

    });

const isImage =
  element.tagName === "IMG";


if (!hasDirectText && !isImage) {
  return;
}


    /*
      不可见文字不进入装修系统
    */

    const style =
      previewFrame.contentWindow
        .getComputedStyle(element);

    if (
      style.display === "none" ||
      style.visibility === "hidden"
    ) {
      return;
    }


    /*
      鼠标经过：
      告诉 Kevin “这里可以点”
    */

    element.style.cursor = "pointer";


    element.addEventListener(
      "mouseenter",
      function (event) {

        event.stopPropagation();

        if (element !== selectedElement) {

          element.style.outline =
            "2px dashed rgba(80, 80, 80, 0.45)";

          element.style.outlineOffset =
            "4px";

        }

      }
    );


    element.addEventListener(
      "mouseleave",
      function () {

        if (element !== selectedElement) {

          element.style.outline = "";
          element.style.outlineOffset = "";

        }

      }
    );


    /*
      点击任意文字：
      自动识别对象
    */

    element.addEventListener(
      "click",
      function (event) {

        /*
          Ctrl + 点击链接：
          不装修，直接在左侧预览区进入该页面
        */

        const link =
          element.closest("a");

        if (event.ctrlKey && link) {

          event.preventDefault();
          event.stopPropagation();

          previewFrame.contentWindow.location.href =
            link.href;

          return;

        }


        /*
          普通单击：
          阻止链接跳转，进入装修模式
        */

        event.preventDefault();
        event.stopPropagation();

        const selector =
          createUniqueSelector(element);

        const label =
          createElementLabel(element);

        selectElementFromPreview(
          selector,
          label,
          element
        );

      }
    );
  });

}


/*
  =====================================================
  自动生成唯一 selector
  =====================================================
*/

function createUniqueSelector(element) {

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;


  /*
    第一优先：ID
  */

  if (element.id) {

    const idSelector =
      "#" + CSS.escape(element.id);

    if (
      doc.querySelectorAll(idSelector).length === 1
    ) {
      return idSelector;
    }

  }


  /*
    第二优先：
    尝试 tag + class
  */

  if (element.classList.length > 0) {

    const classSelector =
      element.tagName.toLowerCase() +
      "." +
      Array.from(element.classList)
        .map(function (className) {
          return CSS.escape(className);
        })
        .join(".");

    try {

      if (
        doc.querySelectorAll(classSelector).length === 1
      ) {
        return classSelector;
      }

    } catch (error) {

      console.log(
        "Class selector 无法使用：",
        classSelector
      );

    }

  }


  /*
    第三优先：
    自动建立 DOM 路径。

    例如：
    .cards > .card:nth-of-type(2) > h2
  */

  const path = [];

  let current = element;


  while (
    current &&
    current !== doc.body
  ) {

    let part =
      current.tagName.toLowerCase();


    /*
      如果当前节点有 ID，
      到这里就可以停止继续向上寻找
    */

    if (current.id) {

      part =
        "#" + CSS.escape(current.id);

      path.unshift(part);

      break;

    }


    /*
      优先加入 class，
      增加 selector 可读性
    */

    if (current.classList.length > 0) {

      part +=
        "." +
        Array.from(current.classList)
          .map(function (className) {
            return CSS.escape(className);
          })
          .join(".");

    }


    /*
      如果同级存在相同 tag，
      增加 nth-of-type，
      保证能够区分第1、第2、第3张卡片。
    */

    const parent =
      current.parentElement;

    if (parent) {

      const sameTagSiblings =
        Array.from(parent.children)
          .filter(function (child) {

            return (
              child.tagName === current.tagName
            );

          });


      if (sameTagSiblings.length > 1) {

        const index =
          sameTagSiblings.indexOf(current) + 1;

        part +=
          ":nth-of-type(" +
          index +
          ")";

      }

    }


    path.unshift(part);

    current =
      current.parentElement;

  }


  return path.join(" > ");

}


/*
  =====================================================
  自动生成右侧显示名称
  =====================================================
*/

function createElementLabel(element) {
if (element.tagName === "IMG") {

  const alt =
    element.getAttribute("alt") || "";

  return alt
    ? "图片｜" + alt
    : "图片";

}
  let text =
    element.innerText
      .trim()
      .replace(/\s+/g, " ");


  /*
    右侧下拉菜单不要出现整段长文章。
  */

  if (text.length > 30) {

    text =
      text.substring(0, 30) +
      "…";

  }


  if (text) {
    return text;
  }


  return element.tagName.toLowerCase();

}


/*
  =====================================================
  左侧点选以后，同步右侧控制台
  =====================================================
*/

function selectElementFromPreview(
  selector,
  label,
  element
) {

  /*
    清除上一个对象的选中框
  */

  if (selectedElement) {

    selectedElement.style.outline = "";
    selectedElement.style.outlineOffset = "";

  }


  selectedElement = element;


  /*
    检查右侧菜单中是否已经存在这个对象。

    如果不存在：
    自动创建。

    这就是取消手工登记的关键。
  */

  let existingOption =
    Array.from(elementSelect.options)
      .find(function (option) {

        return option.value === selector;

      });


  if (!existingOption) {

    const option =
      document.createElement("option");

    option.value = selector;
    option.textContent = label;

    elementSelect.appendChild(option);

  } else {

    /*
      已存在时也更新显示名称，
      防止文字修改后仍显示旧名称。
    */

    existingOption.textContent = label;

  }


  /*
    右侧文字对象菜单同步
  */

  elementSelect.value = selector;


  /*
    保存当前原始状态
  */

  originalStyle =
    selectedElement.getAttribute("style") || "";

  originalHTML =
    selectedElement.innerHTML;


  /*
    红色选中框
  */

  selectedElement.style.outline =
    "3px solid #e53935";

  selectedElement.style.outlineOffset =
    "5px";


  /*
    读取当前文字与样式
  */

  loadCurrentValues();


  /*
    状态提示
  */

  statusBox.textContent =
    "已自动识别并选中：" + label;

}

    function rgbToHex(rgb) {

      const result =
        rgb.match(/\d+/g);

      if (!result || result.length < 3) {
        return "#2b2b2b";
      }

      return "#" +
        result
        .slice(0, 3)
        .map(function (x) {
          return parseInt(x)
            .toString(16)
            .padStart(2, "0");
        })
        .join("");

    }


    /*
      防止 textarea 内容被当成 HTML 执行
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
