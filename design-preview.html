<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>huangfamilies.com｜全站可视化装修台</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #ececec;
      color: #222;
    }

    /* ===== 顶部工具栏 ===== */

    .designer-header {
      height: 64px;
      background: #222;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;
      gap: 20px;
    }

    .designer-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .designer-title span {
      color: #aaa;
      font-weight: 400;
      margin-left: 8px;
      font-size: 13px;
    }

    .page-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-switcher label {
      color: #bbb;
      font-size: 13px;
    }

    select,
    input,
    textarea,
    button {
      font: inherit;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 8px 9px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 9px 14px;
      cursor: pointer;
    }

    /* ===== 主工作区 ===== */

    .workspace {
      height: calc(100vh - 64px);

      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    /* ===== 左侧真实网页预览 ===== */

    .preview-area {
      padding: 18px;
      overflow: hidden;
    }

    .preview-frame-wrap {
      width: 100%;
      height: 100%;

      background: white;
      border-radius: 8px;
      overflow: hidden;

      box-shadow: 0 3px 18px rgba(0,0,0,.15);
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* ===== 右侧装修控制台 ===== */

    .control-panel {
      background: #fafafa;
      border-left: 1px solid #ccc;
      padding: 18px;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .control-group {
      margin-bottom: 17px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 8px;
      align-items: center;
    }

    #fontColor {
      height: 38px;
      padding: 2px;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.5;
    }

    .status {
      padding: 10px;
      margin: 15px 0;

      background: #f0f0f0;
      border-radius: 5px;

      color: #555;
      font-size: 12px;
      line-height: 1.6;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #ddd;
      color: #222;
    }

    .output-box {
      margin-top: 18px;
    }

    #cssOutput {
      min-height: 130px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    /* ===== 小屏 ===== */

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }

      .preview-area {
        height: 70vh;
      }

      .control-panel {
        border-left: 0;
        border-top: 1px solid #ccc;
      }

      .designer-header {
        height: auto;
        padding: 12px;
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

  <!-- ===== 装修台顶部 ===== -->

  <header class="designer-header">

    <div class="designer-title">
      huangfamilies.com
      <span>全站可视化装修台 v0.1</span>
    </div>

    <div class="page-switcher">

      <label for="pageSelect">页面</label>

      <select id="pageSelect">
        <option value="index.html">首页｜黄氏数字家园</option>
        <option value="huangshi.html">黄氏源流</option>
        <option value="misterwutong.html">忢同先生</option>
        <option value="xiuqizhiping.html">修齐治平</option>
      </select>

    </div>

  </header>


  <main class="workspace">

    <!-- ===== 左：真实页面 ===== -->

    <section class="preview-area">

      <div class="preview-frame-wrap">

        <iframe
          id="previewFrame"
          src="index.html"
          title="网站实时预览">
        </iframe>

      </div>

    </section>


    <!-- ===== 右：控制台 ===== -->

    <aside class="control-panel">

      <h2 class="panel-title">装修控制台</h2>

      <p class="panel-subtitle">
        选择页面和文字对象，调整参数后，左侧实时预览。
        v0.1 只做预览，不直接修改正式网页。
      </p>


      <!-- 文字对象 -->

      <div class="control-group">

        <label for="elementSelect">
          文字对象
        </label>

        <select id="elementSelect">
          <option value="">请选择文字对象</option>
        </select>

      </div>


      <!-- 内容 -->

      <div class="control-group">

        <label for="textContent">
          文字内容
        </label>

        <textarea
          id="textContent"
          placeholder="选择文字对象后显示内容">
        </textarea>

      </div>


      <!-- 字体 -->

      <div class="control-group">

        <label for="fontFamily">
          字体
        </label>

        <select id="fontFamily">
          <option value='"Microsoft YaHei", sans-serif'>微软雅黑</option>
          <option value='"PingFang SC", sans-serif'>苹方</option>
          <option value='"SimSun", serif'>宋体</option>
          <option value='"SimHei", sans-serif'>黑体</option>
          <option value='"KaiTi", serif'>楷体</option>
          <option value='"FangSong", serif'>仿宋</option>
          <option value='"LiSu", serif'>隶书</option>
          <option value='Georgia, serif'>Georgia</option>
          <option value='"Times New Roman", serif'>Times New Roman</option>
        </select>

      </div>


      <!-- 字号 / 字重 -->

      <div class="two-column">

        <div class="control-group">

          <label for="fontSize">
            字号 px
          </label>

          <input
            id="fontSize"
            type="number"
            min="8"
            max="150"
            value="24">

        </div>


        <div class="control-group">

          <label for="fontWeight">
            字重
          </label>

          <select id="fontWeight">
            <option value="300">300 Light</option>
            <option value="400">400 Normal</option>
            <option value="500">500</option>
            <option value="600">600</option>
            <option value="700">700 Bold</option>
            <option value="800">800</option>
          </select>

        </div>

      </div>


      <!-- 颜色 -->

      <div class="control-group">

        <label>
          文字颜色
        </label>

        <div class="color-row">

          <input
            id="fontColor"
            type="color"
            value="#2b2b2b">

          <input
            id="fontColorText"
            type="text"
            value="#2b2b2b">

        </div>

      </div>


      <!-- 行距 / 字距 -->

      <div class="two-column">

        <div class="control-group">

          <label for="lineHeight">
            行距
          </label>

          <input
            id="lineHeight"
            type="number"
            min="0.5"
            max="5"
            step="0.1"
            value="1.5">

        </div>


        <div class="control-group">

          <label for="letterSpacing">
            字距 px
          </label>

          <input
            id="letterSpacing"
            type="number"
            min="-10"
            max="30"
            step="1"
            value="0">

        </div>

      </div>


      <!-- X / Y -->

      <div class="two-column">

        <div class="control-group">

          <label for="moveX">
            左右 X px
          </label>

          <input
            id="moveX"
            type="number"
            min="-500"
            max="500"
            value="0">

        </div>


        <div class="control-group">

          <label for="moveY">
            上下 Y px
          </label>

          <input
            id="moveY"
            type="number"
            min="-500"
            max="500"
            value="0">

        </div>

      </div>


      <div class="status" id="statusBox">
        当前：等待选择文字对象。
      </div>


      <div class="button-row">

        <button
          class="secondary"
          id="resetButton">
          恢复当前对象
        </button>

        <button
          class="primary"
          id="generateButton">
          生成 CSS
        </button>

      </div>


      <div class="output-box">

        <div class="control-group">

          <label for="cssOutput">
            最终 CSS / 配置
          </label>

          <textarea
            id="cssOutput"
            readonly
            placeholder="调整完成后点击“生成 CSS”">
          </textarea>

        </div>

      </div>

    </aside>

  </main>


  <script>

    /*
      =====================================================
      huangfamilies.com 全站可视化装修台 v0.1

      原则：
      1. 左侧 iframe 读取真实网页。
      2. 所有修改只发生在浏览器当前预览。
      3. 不写回 GitHub。
      4. 不破坏正式页面。
      =====================================================
    */


    const pageSelect = document.getElementById("pageSelect");
    const previewFrame = document.getElementById("previewFrame");

    const elementSelect = document.getElementById("elementSelect");

    const textContent = document.getElementById("textContent");

    const fontFamily = document.getElementById("fontFamily");
    const fontSize = document.getElementById("fontSize");
    const fontWeight = document.getElementById("fontWeight");

    const fontColor = document.getElementById("fontColor");
    const fontColorText = document.getElementById("fontColorText");

    const lineHeight = document.getElementById("lineHeight");
    const letterSpacing = document.getElementById("letterSpacing");

    const moveX = document.getElementById("moveX");
    const moveY = document.getElementById("moveY");

    const resetButton = document.getElementById("resetButton");
    const generateButton = document.getElementById("generateButton");

    const cssOutput = document.getElementById("cssOutput");
    const statusBox = document.getElementById("statusBox");


    let selectedElement = null;

    let originalStyle = "";
    let originalHTML = "";


    /*
      不同页面目前允许装修的对象。

      后续增加页面，只需要继续在这里增加对象。
    */

    const editableElements = {

      "index.html": [
        [".eyebrow", "LIVING FAMILY ARCHIVE"],
        ["h1", "黄氏数字家园"],
        [".mission", "首页使命文字"],
        [".sub", "首页底部说明"]
      ],

      "huangshi.html": [
        [".eyebrow", "黄氏源流英文标题"],
        ["h1", "黄氏源流"],
        [".intro", "黄氏源流说明"]
      ],

      "misterwutong.html": [
        [".eyebrow", "MISTER WUTONG"],
        ["h1", "忢同先生"],
        [".identity", "Kevin 黄忢同"],
        [".intro", "忢同先生说明"]
      ],

      "xiuqizhiping.html": [
        [".eyebrow", "FROM SELF TO SOCIETY"],
        ["h1", "修齐治平"],
        [".intro", "修齐治平说明"]
      ]

    };


    /*
      页面切换
    */

    pageSelect.addEventListener("change", function () {

      selectedElement = null;

      previewFrame.src = this.value;

      elementSelect.innerHTML =
        '<option value="">请选择文字对象</option>';

      statusBox.textContent =
        "正在加载：" + this.options[this.selectedIndex].text;

    });


    /*
      iframe 加载完成
    */

    previewFrame.addEventListener("load", function () {

      buildElementList();

      statusBox.textContent =
        "页面已加载。请选择右侧文字对象开始装修。";

    });


    /*
      建立当前页面可编辑对象列表
    */

    function buildElementList() {

      const page = pageSelect.value;

      elementSelect.innerHTML =
        '<option value="">请选择文字对象</option>';

      const list = editableElements[page] || [];

      list.forEach(function (item) {

        const option = document.createElement("option");

        option.value = item[0];
        option.textContent = item[1];

        elementSelect.appendChild(option);

      });

    }


    /*
      选择文字对象
    */

    elementSelect.addEventListener("change", function () {

      const selector = this.value;

      if (!selector) {
        selectedElement = null;
        return;
      }

      const doc =
        previewFrame.contentDocument ||
        previewFrame.contentWindow.document;

      selectedElement = doc.querySelector(selector);

      if (!selectedElement) {

        statusBox.textContent =
          "未找到对象：" + selector;

        return;

      }

      originalStyle =
        selectedElement.getAttribute("style") || "";

      originalHTML =
        selectedElement.innerHTML;

      loadCurrentValues();

      statusBox.textContent =
        "正在装修：" +
        this.options[this.selectedIndex].text;

    });


    /*
      把网页当前参数读取到右侧面板
    */

    function loadCurrentValues() {

      if (!selectedElement) return;

      const win = previewFrame.contentWindow;

      const style =
        win.getComputedStyle(selectedElement);

      textContent.value =
        selectedElement.innerText;

      fontSize.value =
        parseFloat(style.fontSize) || 24;

      fontWeight.value =
        style.fontWeight || 400;

      fontColor.value =
        rgbToHex(style.color);

      fontColorText.value =
        rgbToHex(style.color);

      lineHeight.value =
        parseFloat(style.lineHeight) /
        parseFloat(style.fontSize) || 1.5;

      letterSpacing.value =
        style.letterSpacing === "normal"
          ? 0
          : parseFloat(style.letterSpacing) || 0;

      moveX.value = 0;
      moveY.value = 0;

    }


    /*
      所有控制项变化时，立即更新左侧页面
    */

    const liveControls = [
      textContent,
      fontFamily,
      fontSize,
      fontWeight,
      fontColor,
      fontColorText,
      lineHeight,
      letterSpacing,
      moveX,
      moveY
    ];


    liveControls.forEach(function (control) {

      control.addEventListener("input", applyChanges);
      control.addEventListener("change", applyChanges);

    });


    function applyChanges() {

      if (!selectedElement) return;


      /*
        文字内容
        textarea 换行转换为 <br>
      */

      selectedElement.innerHTML =
        escapeHTML(textContent.value)
        .replace(/\n/g, "<br>");


      /*
        字体
      */

      selectedElement.style.fontFamily =
        fontFamily.value;


      /*
        字号
      */

      selectedElement.style.fontSize =
        fontSize.value + "px";


      /*
        字重
      */

      selectedElement.style.fontWeight =
        fontWeight.value;


      /*
        颜色同步
      */

      let color = fontColorText.value;

      if (
        document.activeElement === fontColor
      ) {

        color = fontColor.value;
        fontColorText.value = color;

      } else if (
        /^#[0-9A-Fa-f]{6}$/.test(fontColorText.value)
      ) {

        fontColor.value = fontColorText.value;
        color = fontColorText.value;

      }

      selectedElement.style.color = color;


      /*
        行距 / 字距
      */

      selectedElement.style.lineHeight =
        lineHeight.value;

      selectedElement.style.letterSpacing =
        letterSpacing.value + "px";


      /*
        X / Y 位置
      */

      selectedElement.style.transform =
        "translate(" +
        moveX.value +
        "px, " +
        moveY.value +
        "px)";

    }


    /*
      恢复当前对象
    */

    resetButton.addEventListener("click", function () {

      if (!selectedElement) return;

      selectedElement.setAttribute(
        "style",
        originalStyle
      );

      selectedElement.innerHTML =
        originalHTML;

      loadCurrentValues();

      statusBox.textContent =
        "当前对象已恢复到打开装修前的状态。";

    });


    /*
      生成当前对象最终 CSS
    */

    generateButton.addEventListener("click", function () {

      if (!selectedElement) {

        statusBox.textContent =
          "请先选择文字对象。";

        return;

      }

      const selector =
        elementSelect.value;

      const css =
`${selector} {
  font-family: ${fontFamily.value};
  font-size: ${fontSize.value}px;
  font-weight: ${fontWeight.value};
  color: ${fontColorText.value};
  line-height: ${lineHeight.value};
  letter-spacing: ${letterSpacing.value}px;
  transform: translate(${moveX.value}px, ${moveY.value}px);
}`;

      cssOutput.value = css;

      statusBox.textContent =
        "CSS 已生成。正式页面尚未被修改。";

    });


    /*
      RGB → HEX
    */

    function rgbToHex(rgb) {

      const result =
        rgb.match(/\d+/g);

      if (!result || result.length < 3) {
        return "#2b2b2b";
      }

      return "#" +
        result
        .slice(0, 3)
        .map(function (x) {
          return parseInt(x)
            .toString(16)
            .padStart(2, "0");
        })
        .join("");

    }


    /*
      防止 textarea 内容被当成 HTML 执行
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
