<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #ececec;
      color: #222;
    }

    /* ===== 顶部工具栏 ===== */

    .designer-header {
      height: 64px;
      background: #222;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;
      gap: 20px;
    }

    .designer-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .designer-title span {
      color: #aaa;
      font-weight: 400;
      margin-left: 8px;
      font-size: 13px;
    }

    .page-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-switcher label {
      color: #bbb;
      font-size: 13px;
    }

    select,
    input,
    textarea,
    button {
      font: inherit;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 8px 9px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 9px 14px;
      cursor: pointer;
    }

    /* ===== 主工作区 ===== */

    .workspace {
      height: calc(100vh - 64px);

      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
    }

    /* ===== 左侧真实网页预览 ===== */

    .preview-area {
      padding: 18px;
      overflow: hidden;
    }

    .preview-frame-wrap {
      width: 100%;
      height: 100%;

      background: white;
      border-radius: 8px;
      overflow: hidden;

      box-shadow: 0 3px 18px rgba(0,0,0,.15);
    }

    #previewFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* ===== 右侧装修控制台 ===== */

    .control-panel {
      background: #fafafa;
      border-left: 1px solid #ccc;
      padding: 18px;
      overflow-y: auto;
    }

    .panel-title {
      margin: 0 0 5px;
      font-size: 20px;
    }

    .panel-subtitle {
      margin: 0 0 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .control-group {
      margin-bottom: 17px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 55px 1fr;
      gap: 8px;
      align-items: center;
    }

    #fontColor {
      height: 38px;
      padding: 2px;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.5;
    }

    .status {
      padding: 10px;
      margin: 15px 0;

      background: #f0f0f0;
      border-radius: 5px;

      color: #555;
      font-size: 12px;
      line-height: 1.6;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #ddd;
      color: #222;
    }

    .output-box {
      margin-top: 18px;
    }

    #cssOutput {
      min-height: 130px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    /* ===== 小屏 ===== */

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
      }

      .preview-area {
        height: 70vh;
      }

      .control-panel {
        border-left: 0;
        border-top: 1px solid #ccc;
      }

      .designer-header {
        height: auto;
        padding: 12px;
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

const addHeadingBlockButton =

let selectedElement = null;

    /*
      =====================================================
      v0.3｜Kevin 装修修改持久化存储
      =====================================================

      Save ≠ Publish

      1. Kevin 的装修修改自动保存到浏览器 localStorage。
      2. 刷新、关闭浏览器后，修改仍然保留。
      3. 保存的修改属于“待发布修改”。
      4. 此阶段仍然不直接修改 GitHub 正式网页。
    */

    const STORAGE_KEY =
      "huangfamilies-design-changes-v0.3";

    const VIRTUAL_NODE_STORAGE_KEY =
      "huangfamilies-virtual-nodes-v0.1";
/*
  =====================================================
  Block Content Model v0.1
  Page = Blocks
  =====================================================

  Block 只负责页面内容。
  Branch 管版本；Node 管位置；Block 管内容。

  MVP Block：
  1. heading
  2. text
  3. image
*/

const BLOCK_STORAGE_KEY =
  "huangfamilies-page-blocks-v0.1";

let pageBlocks =
  loadPageBlocks();


function loadPageBlocks() {

  try {

    const saved =
      localStorage.getItem(
        BLOCK_STORAGE_KEY
      );

    return saved
      ? JSON.parse(saved)
      : {};

  } catch (error) {

    console.log(
      "读取 Page Blocks 失败：",
      error
    );

    return {};

  }

}


function writePageBlocks() {

  try {

    localStorage.setItem(
      BLOCK_STORAGE_KEY,
      JSON.stringify(pageBlocks)
    );

  } catch (error) {

    console.log(
      "保存 Page Blocks 失败：",
      error
    );

  }

}


function createBlockId() {

  return (
    "block-" +
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2, 8)
  );

}


function normalizeBlockOrder(pageId) {

  if (
    !pageBlocks[pageId] ||
    !Array.isArray(pageBlocks[pageId])
  ) {
    return;
  }

  pageBlocks[pageId]
    .forEach(function (block, index) {

      block.order =
        index + 1;

    });

}
    let savedChanges =
      loadSavedChanges();

    let virtualNodes = {};

    let currentVirtualPageId = "";

    try {

      const storedVirtualNodes =
        localStorage.getItem(
          VIRTUAL_NODE_STORAGE_KEY
        );

      virtualNodes =
        storedVirtualNodes
          ? JSON.parse(storedVirtualNodes)
          : {};

    } catch (error) {

      console.log(
        "读取 Virtual Draft Tree 失败：",
        error
      );

    function loadSavedChanges() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return {};
        }

        return JSON.parse(saved);

      } catch (error) {

        console.log(
          "读取装修修改失败：",
          error
        );

        return {};

      }

    }


    function writeSavedChanges() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(savedChanges)
        );

      } catch (error) {

        console.log(
          "保存装修修改失败：",
          error
        );

      }

    }
function updateSaveStatus(mode) {

  const count =
    Object.keys(savedChanges).length;

  if (count === 0) {

    saveStatusBox.textContent =
      "○ 尚无待发布修改";

    return;
  }


  if (mode === "restored") {

    saveStatusBox.textContent =
      "✓ 已恢复 ｜ 待发布 " +
      count +
      " 项";

    return;
  }


  saveStatusBox.textContent =
    "✓ 已自动保存 ｜ 待发布 " +
    count +
    " 项";

}

previewFrame.addEventListener("load", function () {

const currentPageId =

/*

*/

if (!pageOption) {

}

pageSelect.value =

    );

if (currentVirtualPageId) {

}

ensureBlockStructureForCurrentPage();

buildElementList();

const restoredCount =
  restoreSavedChangesForCurrentPage();

enableDirectSelection();

if (restoredCount > 0) {

  updateSaveStatus("restored");

  statusBox.textContent =

} else {

  statusBox.textContent =

}


});

/*
  =====================================================
  Content Node v0.1｜真实 Page ID
  =====================================================

  页面身份来自 iframe 当前真实 URL，
  不再来自顶部四页面下拉菜单。

  根目录页面：
  /huangshi.html

  未来深层页面：
  /huangshi/america/new-york.html

  都可以成为独立 Page ID。
*/

function getCurrentPageId() {
  if (currentVirtualPageId) {
    return currentVirtualPageId;
  }
  try {

    const currentPath =
      previewFrame.contentWindow.location.pathname;

    const repoMarker =
      "/huangfamilies.com/";

    let pageId =
      currentPath;

    if (pageId.includes(repoMarker)) {

      pageId =
        pageId.split(repoMarker)[1];

    } else {

      pageId =
        pageId.split("/").filter(Boolean).join("/");

    }

    pageId =
      pageId.replace(/^\/+|\/+$/g, "");

    if (!pageId) {
      return "index.html";
    }

    const lastPart =
      pageId.split("/").pop();

    if (!lastPart.includes(".")) {
      pageId += "/index.html";
    }

    return pageId;

  } catch (error) {

    console.log(
      "无法读取真实 Page ID：",
      error
    );

    return pageSelect.value || "index.html";

  }

}
    /*

/*
  =====================================================
  Block Content Model v0.1
  Legacy Page → Block Page Upgrade
  =====================================================

  目标：
  1. 已经是 Block Page：不重复处理。
  2. 旧 Virtual Page：保留现有内容。
  3. breadcrumb / navigation 不进入 Block。
  4. h1 = Heading Block。
  5. h1 后、导航前的正文 = Content Blocks。
*/

function ensureBlockStructureForCurrentPage() {

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;

  const pageId =
    getCurrentPageId();

  const main =
    doc.querySelector("main");

  if (!main || !pageId) {
    return;
  }


  /*
    =====================================================
    Step 1｜保证 Page 有 Block DOM 结构
    =====================================================
  */

  let heading =
    main.querySelector("h1");

  if (!heading) {
    return;
  }


  if (!heading.dataset.blockId) {

    heading.dataset.blockId =
      createBlockId();

  }

  heading.dataset.blockType =
    "heading";


  let container =
    doc.querySelector(
      '[data-block-container="true"]'
    );


  /*
    Legacy Page：
    第一次进入时建立正文 Block Container。
  */

  if (!container) {

    container =
      doc.createElement("div");

    container.id =
      "pageBlocks";

    container.dataset.blockContainer =
      "true";


    const contentElements = [];

    let current =
      heading.nextElementSibling;


    while (current) {

      const next =
        current.nextElementSibling;

      /*
        Child Navigation 不是正文 Block。
      */

      if (
        current.id !==
        "virtualChildList"
      ) {

function getPreviewLinkLabel(link) {

function findUniqueVirtualChildTarget(link) {

  const currentPageId =
    getCurrentPageId();

  const label =
    getPreviewLinkLabel(link);

  if (!label) {
    return "";
  }

  const matches =
    Object.values(virtualNodes)
      .filter(function (node) {
        return (
          node.parentPageId === currentPageId &&
          node.title === label
        );
      });

  if (matches.length !== 1) {

    statusBox.textContent =
      matches.length === 0
        ? "未找到唯一 Content Node 目标：" + label
        : "发现多个同名 Content Node，停止导航：" + label;

    return "";
  }

  return matches[0].pageId;

function resolvePreviewTargetPageId(rawHref) {

  const currentPageId =
    getCurrentPageId();

  const baseUrl =
    new URL(
      currentPageId,
      "https://preview.local/"
    );

  const targetUrl =
    new URL(rawHref, baseUrl);

  let targetPageId =
    decodeURIComponent(
      targetUrl.pathname
    )
      .split("/")
      .filter(Boolean)
      .join("/");

  if (!targetPageId) {
    targetPageId = "index.html";
  }

  const lastPart =
    targetPageId.split("/").pop();

  if (!lastPart.includes(".")) {
    targetPageId += "/index.html";
  }

  return targetPageId;
}

function navigatePreviewLink(link) {

  if (!link) {
    return false;
  }

  const rawHref =
    (link.getAttribute("href") || "").trim();

  if (
    !rawHref ||
    rawHref.startsWith("javascript:")
  ) {
    return false;
  }

  let targetPageId = "";

  if (rawHref === "#") {

    targetPageId =
      findUniqueVirtualChildTarget(link);

    if (!targetPageId) {
      return false;
    }

  } else {

    targetPageId =
      resolvePreviewTargetPageId(rawHref);

  }

  if (virtualNodes[targetPageId]) {

    loadVirtualNode(targetPageId);
    return true;
  }

  currentVirtualPageId = "";

  previewFrame.removeAttribute("srcdoc");
  previewFrame.src = targetPageId;

  return true;

function createUniqueSelector(element) {

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;


  /*
    第一优先：ID
  */

  if (element.id) {

    const idSelector =
      "#" + CSS.escape(element.id);

    if (
      doc.querySelectorAll(idSelector).length === 1
    ) {
      return idSelector;
    }

  }


  /*
    第二优先：
    尝试 tag + class
  */

  if (element.classList.length > 0) {

    const classSelector =
      element.tagName.toLowerCase() +
      "." +
      Array.from(element.classList)
        .map(function (className) {
          return CSS.escape(className);
        })
        .join(".");

    try {

      if (
        doc.querySelectorAll(classSelector).length === 1
      ) {
        return classSelector;
      }

    } catch (error) {

      console.log(
        "Class selector 无法使用：",
        classSelector
      );

    }

  }


  /*
    第三优先：
    自动建立 DOM 路径。

    例如：
    .cards > .card:nth-of-type(2) > h2
  */

  const path = [];

  let current = element;


  while (
    current &&
    current !== doc.body
  ) {

    let part =
      current.tagName.toLowerCase();


    /*
      如果当前节点有 ID，
      到这里就可以停止继续向上寻找
    */

    if (current.id) {

      part =
        "#" + CSS.escape(current.id);

      path.unshift(part);

      break;

    }


    /*
      优先加入 class，
      增加 selector 可读性
    */

    if (current.classList.length > 0) {

      part +=
        "." +
        Array.from(current.classList)
          .map(function (className) {
            return CSS.escape(className);
          })
          .join(".");

    }


    /*
      如果同级存在相同 tag，
      增加 nth-of-type，
      保证能够区分第1、第2、第3张卡片。
    */

    const parent =
      current.parentElement;

    if (parent) {

      const sameTagSiblings =
        Array.from(parent.children)
          .filter(function (child) {

            return (
              child.tagName === current.tagName
            );

          });


      if (sameTagSiblings.length > 1) {

        const index =
          sameTagSiblings.indexOf(current) + 1;

        part +=
          ":nth-of-type(" +
          index +
          ")";

      }

    }


    path.unshift(part);

    current =
      current.parentElement;

  }


  return path.join(" > ");

}

*/

function selectElementFromPreview(
  selector,
  label,
  element
) {

  /*
    清除上一个对象的选中框
  */

  if (selectedElement) {

    selectedElement.style.outline = "";
    selectedElement.style.outlineOffset = "";

  }


  selectedElement = element;


  /*
    检查右侧菜单中是否已经存在这个对象。

    如果不存在：
    自动创建。

    这就是取消手工登记的关键。
  */

  let existingOption =
    Array.from(elementSelect.options)
      .find(function (option) {

        return option.value === selector;

      });


  if (!existingOption) {

    const option =
      document.createElement("option");

    option.value = selector;
    option.textContent = label;

    elementSelect.appendChild(option);

  } else {

    /*
      已存在时也更新显示名称，
      防止文字修改后仍显示旧名称。
    */

    existingOption.textContent = label;

  }


  /*
    右侧文字对象菜单同步
  */

  elementSelect.value = selector;


  /*
    保存当前原始状态
  */

  originalStyle =
    selectedElement.getAttribute("style") || "";

  originalHTML =
    selectedElement.innerHTML;


  /*
    红色选中框
  */

  selectedElement.style.outline =
    "3px solid #e53935";

  selectedElement.style.outlineOffset =
    "5px";


  /*
    读取当前文字与样式
  */

  loadCurrentValues();


  /*
    状态提示
  */

  statusBox.textContent =
    "已自动识别并选中：" + label;

}
 /*
 RGB → HEX

    function rgbToHex(rgb) {

      const result =
        rgb.match(/\d+/g);

      if (!result || result.length < 3) {
        return "#2b2b2b";
      }

      return "#" +
        result
        .slice(0, 3)
        .map(function (x) {
          return parseInt(x)
            .toString(16)
            .padStart(2, "0");
        })
        .join("");

    }


    /*
      防止 textarea 内容被当成 HTML 执行
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

function getCurrentBlockContext() {

  const pageId =
    getCurrentPageId();

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;

  const container =
    doc.querySelector(
      '[data-block-container="true"]'
    );

  if (
    !pageId ||
    !container ||
    !Array.isArray(pageBlocks[pageId])
  ) {
    return null;
  }

  return {
    pageId: pageId,
    doc: doc,
    container: container,
    blocks: pageBlocks[pageId]
  };

}


function syncSelectedBlockToStorage() {

  if (
    !selectedElement ||
    !selectedElement.dataset ||
    !selectedElement.dataset.blockId
  ) {
    return;
  }

  const context =
    getCurrentBlockContext();

  if (!context) {
    return;
  }

  const blockId =
    selectedElement.dataset.blockId;

  const block =
    context.blocks.find(
      function (item) {
        return item.blockId === blockId;
      }
    );

  if (!block) {
    return;
  }


  if (block.type === "image") {

    block.src =
      selectedElement.getAttribute("src") ||
      "";

    block.alt =
      selectedElement.getAttribute("alt") ||
      "";

  } else {

    block.content =
      selectedElement.innerText;

  }


  block.style = {

    fontFamily:
      fontFamily.value,

    fontSize:
      fontSize.value,

    fontWeight:
      fontWeight.value,

    color:
      fontColorText.value,

    lineHeight:
      lineHeight.value,

    letterSpacing:
      letterSpacing.value,

    moveX:
      moveX.value,

    moveY:
      moveY.value,

    imageWidth:
      imageWidth.value,

    imageRadius:
      imageRadius.value

  };


  writePageBlocks();

}


function createBlockElement(
  doc,
  block
) {

  let element = null;


  if (block.type === "image") {

    element =
      doc.createElement("img");

    element.src =
      block.src || "";

    element.alt =
      block.alt || "";

    element.style.display =
      "block";

    element.style.maxWidth =
      "100%";

    element.style.width =
      "100%";

    element.style.margin =
      "24px auto";


  } else if (
    block.type === "heading"
  ) {

    element =
      doc.createElement("h2");

    element.textContent =
      block.content || "新标题";


  } else {

    element =
      doc.createElement("p");

    element.className =
      "lead";

    element.textContent =
      block.content || "请输入文字……";

  }


  element.dataset.blockId =
    block.blockId;

  element.dataset.blockType =
    block.type;


  return element;

}


function addBlock(type) {

  const context =
    getCurrentBlockContext();

  if (!context) {

    statusBox.textContent =
      "当前页面尚未进入 Block 模式。";

    return;

  }


  const block = {

    blockId:
      createBlockId(),

    type:
      type,

    order:
      0,

    style: {}

  };


  if (type === "image") {

    const imageUrl =
      window.prompt(
        "请输入图片 URL：",
        ""
      );

    if (!imageUrl) {
      return;
    }

    block.src =
      imageUrl.trim();

    block.alt =
      "";

  } else if (
    type === "heading"
  ) {

    block.content =
      "新标题";

  } else {

    block.content =
      "请输入文字……";

  }


  /*
    如果当前选中了正文 Block，
    插到它后面。

    否则插到正文末尾。
  */

  let insertIndex =
    context.blocks.length;


  if (
    selectedElement &&
    selectedElement.dataset &&
    selectedElement.dataset.blockId
  ) {

    const selectedBlockId =
      selectedElement.dataset.blockId;

    const selectedIndex =
      context.blocks.findIndex(
        function (item) {

          return (
            item.blockId ===
            selectedBlockId
          );

        }
      );


    if (selectedIndex >= 0) {

      insertIndex =
        selectedIndex + 1;

    }

  }


  context.blocks.splice(
    insertIndex,
    0,
    block
  );


  normalizeBlockOrder(
    context.pageId
  );

  writePageBlocks();


  /*
    DOM 同步：
    不重新加载整个页面，
    直接把新 Block 放进去。
  */

  const element =
    createBlockElement(
      context.doc,
      block
    );


  let referenceElement =
    null;


  if (
    insertIndex > 0
  ) {

    const previousBlock =
      context.blocks[
        insertIndex - 1
      ];

    referenceElement =
      context.doc.querySelector(
        '[data-block-id="' +
        CSS.escape(
          previousBlock.blockId
        ) +
        '"]'
      );

  }


  if (
    referenceElement &&
    referenceElement !==
      context.doc.querySelector("h1")
  ) {

    referenceElement
      .insertAdjacentElement(
        "afterend",
        element
      );

  } else {

    const contentChildren =
      Array.from(
        context.container.children
      );

    const contentIndex =
      context.blocks
        .slice(0, insertIndex)
        .filter(function (item) {

          return (
            item.type !==
            "heading" ||
            item.blockId !==
            context.blocks[0].blockId
          );

        })
        .length;


    if (
      contentIndex <
      contentChildren.length
    ) {

      context.container.insertBefore(
        element,
        contentChildren[
          contentIndex
        ]
      );

    } else {

      context.container.appendChild(
        element
      );

    }

  }


  /*
    新元素加入直接点选系统。
  */

  enableDirectSelection();


  const selector =
    '[data-block-id="' +
    CSS.escape(block.blockId) +
    '"]';

  const label =
    createElementLabel(element);


  selectElementFromPreview(
    selector,
    label,
    element
  );


  statusBox.textContent =
    "已添加 " +
    (
      type === "heading"
        ? "标题"
        : type === "image"
          ? "图片"
          : "文字"
    ) +
    " Block，并已自动保存。";

}

/*

  Slug Helper
  =====================================================
*/

function createNodeSlug(title) {

  return title
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9\u4e00-\u9fff-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");

}
/*
  =====================================================
  Content Node Creator v0.1
  Parent Path Helper
  =====================================================
*/

function getCurrentNodeParentPath() {

  const currentPageId =
    getCurrentPageId();

  if (currentPageId === "index.html") {
    return "";
  }

  if (currentPageId.endsWith("/index.html")) {

    return currentPageId
      .replace(/\/index\.html$/, "");

  }

  if (!currentPageId.includes("/")) {

    return currentPageId
      .replace(/\.html$/, "");

  }

  const parts =
    currentPageId.split("/");

  parts.pop();

  return parts.join("/");

}

/*
  =====================================================
  Virtual Draft Tree v0.1
  =====================================================

  Virtual Node：
  只存在于装修台浏览器 localStorage。

  它可以：
  1. 立即进入；
  2. 作为 Parent；
  3. 继续创建下一级；
  4. 刷新浏览器后恢复。

  它不是 GitHub draft Real Create。
*/

function writeVirtualNodes() {

  try {

    localStorage.setItem(
      VIRTUAL_NODE_STORAGE_KEY,
      JSON.stringify(virtualNodes)
    );

  } catch (error) {

    console.log(
      "保存 Virtual Draft Tree 失败：",
      error
    );

  }

}


function saveVirtualNode(
  draft,
  generatedHTML
) {

  virtualNodes[draft.pageId] = {

    type:
      draft.type,

    title:
      draft.title,

    slug:
      draft.slug,

    parentPath:
      draft.parentPath,

    parentPageId:
      draft.parentPageId,

    draftPath:
      draft.draftPath,

    publishPath:
      draft.publishPath,

    pageId:
      draft.pageId,

    html:
      generatedHTML,

    updatedAt:
      new Date().toISOString()

  };

  writeVirtualNodes();

  addVirtualNodeOption(
    draft.pageId,
    draft.title
  );

}


function addVirtualNodeOption(
  pageId,
  title
) {

  let option =
    Array.from(pageSelect.options)
      .find(function (item) {

        return item.value === pageId;

      });

  if (!option) {

    option =
      document.createElement("option");

    option.value =
      pageId;

    pageSelect.appendChild(
      option
    );

  }

  option.textContent =
    "装修中｜" + title;

  option.dataset.virtual =
    "true";

}


function restoreVirtualNodeOptions() {

  Object.values(virtualNodes)
    .forEach(function (node) {

      addVirtualNodeOption(
        node.pageId,
        node.title
      );

    });

}


function loadVirtualNode(pageId) {

  const node =
    virtualNodes[pageId];

  if (!node) {
    return false;
  }

  currentVirtualPageId =
    pageId;

  pageSelect.value =
    pageId;

  selectedElement =
    null;

  elementSelect.innerHTML =
    '<option value="">请选择文字对象</option>';

  previewFrame.srcdoc =
    node.html;

  statusBox.textContent =
    "正在加载装修中的 Virtual Node：" +
    node.title;

  return true;

}    
/*
  =====================================================
  Virtual Draft Tree｜Child Navigation Renderer v0.1
  =====================================================

  每次进入 Virtual Folder 时，按 parentPageId 动态读取子节点。
  这样后创建的 Child Node 也会自动出现在父目录中，
  不需要重新生成父页面 HTML。
*/
function renderVirtualChildren(pageId) {

  const node =
    virtualNodes[pageId];

  if (!node || node.type !== "folder") {
    return;
  }

  const doc =
    previewFrame.contentDocument ||
    previewFrame.contentWindow.document;

  const main =
    doc.querySelector("main");

  if (!main) {
    return;
  }

  const oldList =
    doc.getElementById("virtualChildList");

  if (oldList) {
    oldList.remove();
  }

  const children =
    Object.values(virtualNodes)
      .filter(function (child) {
        return child.parentPageId === pageId;
      })
      .sort(function (a, b) {
        return a.title.localeCompare(b.title, "zh-CN");
      });

  if (children.length === 0) {
    return;
  }

  const list =
    doc.createElement("div");

  list.id =
    "virtualChildList";

  list.style.display =
    "grid";

  list.style.gap =
    "14px";

  list.style.marginTop =
    "36px";

  children.forEach(function (child) {

    const link =
      doc.createElement("a");

    link.href =
      getRelativeHref(
        node.publishPath,
        child.publishPath
      );

    link.style.display =
      "block";

    link.style.padding =
      "20px 22px";

    link.style.border =
      "1px solid rgba(41, 39, 34, 0.18)";

    link.style.borderRadius =
      "8px";

    link.style.color =
      "inherit";

    link.style.textDecoration =
      "none";

    const title =
      doc.createElement("h2");

    title.textContent =
      child.title;

    title.style.margin =
      "0 0 8px";

    title.style.fontSize =
      "24px";

    const meta =
      doc.createElement("p");

    meta.textContent =
      child.type === "folder"
        ? "进入目录"
        : "打开页面";

    meta.style.margin =
      "0";

    meta.style.opacity =
      "0.68";

    link.appendChild(title);
    link.appendChild(meta);
    list.appendChild(link);

  });

  main.appendChild(list);
}    
function getRelativeHref(fromFile, toFile) {

  const fromParts =
    fromFile.split("/");

  fromParts.pop();

  const toParts =
    toFile.split("/");

  while (
    fromParts.length > 0 &&
    toParts.length > 0 &&
    fromParts[0] === toParts[0]
  ) {
    fromParts.shift();
    toParts.shift();
  }

  const up =
    "../".repeat(fromParts.length);

  return up + toParts.join("/");

}
function buildNodeDraft(type, title) {

  const cleanTitle =
    title.trim();

  const slug =
    createNodeSlug(cleanTitle);

  const parentPath =
    getCurrentNodeParentPath();
  const parentPageId =
    getCurrentPageId();
  let nodePath = "";

  if (type === "folder") {

    nodePath =
      parentPath
        ? parentPath + "/" + slug + "/index.html"
        : slug + "/index.html";

  } else {

    nodePath =
      parentPath
        ? parentPath + "/" + slug + ".html"
        : slug + ".html";

  }

  return {
    type: type,
    title: cleanTitle,
    slug: slug,
    parentPath: parentPath,
    parentPageId: parentPageId,

    draftPath:
      nodePath,

    publishPath:
      nodePath,

    pageId:
      nodePath
  };

}
